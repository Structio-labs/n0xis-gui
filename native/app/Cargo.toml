[package]
name = "n0xis-ui"
description = "N0xis desktop GUI on GPUI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "n0xis-ui"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
n0xis-client.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Headless windows, for tests that press keys the way a person does.
gpui-kit = { workspace = true, features = ["test-support"] }
