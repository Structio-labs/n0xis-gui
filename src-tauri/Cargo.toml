[package]
name = "n0xis-gui"
version = "0.1.0"
description = "N0xis — AI-first reverse-engineering GUI"
authors = ["Largo"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "n0xis_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
